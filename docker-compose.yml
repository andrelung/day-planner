services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dayplanner}
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}'
      POSTGRES_DB: ${POSTGRES_DB:-dayplanner}
    ports:
      # localhost-only — lets tooling running directly on the host (npm run
      # dev/test, prisma migrate) reach the same database Docker uses,
      # via the single root .env's DATABASE_URL. Not reachable from the LAN.
      - '127.0.0.1:${POSTGRES_PORT:-55433}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      # Passed through from the host's actual git state (see the "docker
      # up" README section / rebuild.sh) — falls back to "dev"/no dirty
      # flag if built without them, e.g. a plain `docker compose up --build`.
      args:
        GIT_COMMIT: ${GIT_COMMIT:-dev}
        GIT_DIRTY: ${GIT_DIRTY:-}
        # Unique per invocation of rebuild.sh regardless of git state — see
        # its own comment. This, not GIT_COMMIT, is what the update-notice
        # actually compares.
        BUILD_ID: ${BUILD_ID:-dev}
        # Accumulated "what's uncommitted right now" notes, as a JSON array
        # string — see rebuild.sh.
        DEV_NOTES_JSON: ${DEV_NOTES_JSON:-[]}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${PORT:-3000}:3000'
    volumes:
      # The container's filesystem isn't visible on the host by default —
      # mount the project root so change-log.xlsx (written by the app) lands
      # where the user can actually open it in Excel. See CHANGE_LOG_PATH.
      - .:/host-root
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dayplanner}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dayplanner}?schema=public
      TOKEN_ENCRYPTION_KEY: '${TOKEN_ENCRYPTION_KEY:?set TOKEN_ENCRYPTION_KEY in .env, e.g. openssl rand -base64 32}'
      SESSION_JWT_SECRET: '${SESSION_JWT_SECRET:?set SESSION_JWT_SECRET in .env, e.g. openssl rand -base64 32}'
      PORT: 3000
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      ASANA_CLIENT_ID: ${ASANA_CLIENT_ID:-}
      ASANA_CLIENT_SECRET: ${ASANA_CLIENT_SECRET:-}
      MS_CLIENT_ID: ${MS_CLIENT_ID:-}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET:-}
      MS_TENANT_ID: ${MS_TENANT_ID:-common}
      CHANGE_LOG_PATH: /host-root/change-log.xlsx
      MATCH_LOG_PATH: /host-root/match-log.xlsx
      TZ: ${TZ:-UTC}
      NODE_ENV: production

volumes:
  db-data:
