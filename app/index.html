<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F7FCFF" />
    <title>Day Planner</title>

    <!-- "Install as an app" support — see README "Install as an app" -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Day Planner" />
    <!-- "default" (not "black-translucent") since the app has no
         safe-area-inset padding yet — translucent would let the header
         sit under the iPhone's notch/status bar when installed. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS's native launch screen (shown by the OS itself before ANY web
         content paints, even the static splash below) is blank/black
         unless the page provides `apple-touch-startup-image` links sized
         to the device's exact screen — Apple's own auto-generation from
         the manifest isn't reliably honored. There's no fixed device list
         to maintain here: this draws the icon centered on the app's
         background color at the CURRENT device's actual screen size (via
         screen.width/height + devicePixelRatio) and registers that as both
         the portrait and landscape startup image, so it's correct for
         whatever device it happens to run on, present or future. Gated to
         iOS Safari (the only place `navigator.standalone` exists) since
         these links are meaningless — but not free to generate — elsewhere. -->
    <script>
      if (typeof navigator.standalone !== 'undefined') {
        (function () {
          var dpr = window.devicePixelRatio || 1;
          var screenW = screen.width;
          var screenH = screen.height;
          var img = new Image();
          img.onload = function () {
            var iconSize = img.width / (3 / dpr);
            function makeStartupImage(w, h) {
              var canvas = document.createElement('canvas');
              canvas.width = w;
              canvas.height = h;
              var ctx = canvas.getContext('2d');
              ctx.fillStyle = '#f7fcff';
              ctx.fillRect(0, 0, w, h);
              ctx.drawImage(img, (w - iconSize) / 2, (h - iconSize) / 2, iconSize, iconSize);
              return canvas.toDataURL('image/png');
            }
            var portrait = document.createElement('link');
            portrait.setAttribute('rel', 'apple-touch-startup-image');
            portrait.setAttribute('media', 'screen and (orientation: portrait)');
            portrait.setAttribute('href', makeStartupImage(screenW * dpr, screenH * dpr));
            document.head.appendChild(portrait);
            var landscape = document.createElement('link');
            landscape.setAttribute('rel', 'apple-touch-startup-image');
            landscape.setAttribute('media', 'screen and (orientation: landscape)');
            landscape.setAttribute('href', makeStartupImage(screenH * dpr, screenW * dpr));
            document.head.appendChild(landscape);
          };
          img.src = '/pwa-512.png';
        })();
      }
    </script>

    <!-- Static splash shown instantly at first paint, before the JS bundle
         has loaded/mounted — main.ts removes it once the real app (whose
         own 'loading' screen looks identical) has mounted. Styled inline
         and with hardcoded colors rather than tokens.css so it doesn't wait
         on anything but this HTML document itself. -->
    <style>
      #splash-viewport {
        height: 100vh;
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f7fcff;
        overflow: hidden;
      }
      #splash-phone {
        width: 100%;
        max-width: 480px;
        height: 100%;
        margin: 0 auto;
        background: #ffffff;
        overflow: hidden;
        position: relative;
        display: flex;
        flex-direction: column;
      }
      #splash-loading {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 13px;
        font-weight: 700;
        color: #73798a;
        text-align: center;
      }
      #splash-mark {
        position: relative;
        width: 56px;
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #splash-ring {
        position: absolute;
        inset: 0;
        border: 3px solid #d6d7dc;
        border-top-color: #ffd80a;
        border-radius: 50%;
        animation: splash-spin 0.9s linear infinite;
      }
      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="splash-viewport">
      <div id="splash-phone">
        <div id="splash-loading">
          <div id="splash-mark">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#16203c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="8" height="8" rx="1.5"></rect>
              <rect x="13" y="3" width="8" height="8" rx="1.5"></rect>
              <rect x="3" y="13" width="8" height="8" rx="1.5"></rect>
              <rect x="13" y="13" width="8" height="8" rx="1.5"></rect>
            </svg>
            <div id="splash-ring"></div>
          </div>
          <p>Starting app…</p>
        </div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
